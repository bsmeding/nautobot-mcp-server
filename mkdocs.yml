---
site_name: "Nautobot MCP Server Documentation"
site_url: "https://bsmeding.github.io/nautobot-mcp-server/"
repo_url: "https://github.com/bsmeding/nautobot-mcp-server"
repo_name: "bsmeding/nautobot-mcp-server"
edit_uri: "edit/main/docs"
copyright: "Copyright &copy; bsmeding"

theme:
  name: "material"
  features:
    - "content.code.copy"
    - "navigation.tabs"
    - "navigation.top"
    - "search.highlight"
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: "default"
      toggle:
        icon: "material/weather-sunny"
        name: "Switch to dark mode"
    - media: "(prefers-color-scheme: dark)"
      scheme: "slate"
      toggle:
        icon: "material/weather-night"
        name: "Switch to light mode"

markdown_extensions:
  - "admonition"
  - "pymdownx.highlight"
  - "pymdownx.superfences"
  - "pymdownx.tabbed":
      alternate_style: true
  - "toc":
      permalink: true

plugins:
  - "search"
  - "mkdocstrings":
      handlers:
        python:
          paths: ["."]

nav:
  - "Overview": "index.md"
  - "User Guide":
      - "App Overview": "user/app_overview.md"
      - "Getting Started": "user/app_getting_started.md"
      - "Use Cases": "user/app_use_cases.md"
      - "Tenant Scoping": "user/tenant_scoping.md"
      - "Plugin Integrations": "user/plugins.md"
  - "Administrator Guide":
      - "Install & Configure": "admin/install.md"
      - "Release Notes": "admin/release_notes/index.md"
  - "Developer Guide":
      - "Contributing": "dev/contributing.md"
      - "Development Environment": "dev/dev_environment.md"
