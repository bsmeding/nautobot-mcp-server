---
# Developer overlay: live-reload the mounted source and expose the dev server.
services:
  nautobot:
    command:
      - "sh"
      - "-c"
      - "nautobot-server runserver 0.0.0.0:8080 --insecure"
    ports:
      - "8080:8080"
    volumes:
      - "../:/source"
    environment:
      NAUTOBOT_DEBUG: "True"
      NAUTOBOT_LOG_LEVEL: "DEBUG"
