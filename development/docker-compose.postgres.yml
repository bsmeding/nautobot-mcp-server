---
# PostgreSQL backend for the development environment.
services:
  db:
    image: "postgres:18-alpine"
    env_file:
      - "development.env"
      - "creds.env"
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD", "pg_isready", "--username=$$POSTGRES_USER", "--dbname=$$POSTGRES_DB"]
      interval: "10s"
      timeout: "5s"
      retries: 10

volumes:
  postgres_data: {}
