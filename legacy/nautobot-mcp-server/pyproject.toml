# Final release of the old PyPI project name.
# Build and publish from this directory only. It is not part of the
# nautobot-mcp distribution. Installing nautobot-mcp-server pulls in
# nautobot-mcp, which owns the app and the nautobot-mcp console script.
# The only module here is nautobot_mcp_server, which warns on import.

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nautobot-mcp-server"
version = "0.2.2"
description = "Renamed to nautobot-mcp. This release installs nautobot-mcp."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "bsmeding", email = "b@rtsmeding.nl" },
]
keywords = ["nautobot", "mcp", "renamed"]
classifiers = [
  "Development Status :: 7 - Inactive",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "nautobot-mcp>=0.2.3",
]

[project.optional-dependencies]
nautobot = ["nautobot-mcp[nautobot]>=0.2.3"]
design-builder = ["nautobot-mcp[design-builder]>=0.2.3"]
onboarding = ["nautobot-mcp[onboarding]>=0.2.3"]
ssot = ["nautobot-mcp[ssot]>=0.2.3"]
golden-config = ["nautobot-mcp[golden-config]>=0.2.3"]
nornir = ["nautobot-mcp[nornir]>=0.2.3"]
all = ["nautobot-mcp[all]>=0.2.3"]

[project.urls]
Homepage = "https://pypi.org/project/nautobot-mcp/"
Repository = "https://github.com/bsmeding/nautobot-mcp-server"
Changelog = "https://github.com/bsmeding/nautobot-mcp-server/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["nautobot_mcp_server"]
